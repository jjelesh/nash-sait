  <main class="book">
    <div class="page left">
      <div class="page-head"><h1>语法</h1><p class="sub">грамматика HSK 1–5</p></div>
      <p class="stats" id="stats"></p>

    </div>
    <div class="page right">
      <section class="card">
        <h3>Все правила</h3>
        <input class="search" id="search" placeholder="Поиск: 把, если, сравнение…">
        <div id="list"></div>

  <footer class="foot">

  <script src="js/store.js?v=202611031538"></script>
  <script src="js/sync.js?v=202611031538"></script>
  <script src="js/discipline.js?v=202611031538"></script>
  <script src="js/sections.js?v=202611031538"></script>
  <script src="js/widgets.js?v=202611031538"></script>
  <script src="js/day.js?v=202611031538"></script>
  <script src="js/grammar-data.js?v=202611031538"></script>
  <script src="js/grammar-ui.js?v=202611031538"></script>
  <script>
    const LEVELS = [1, 2, 3, 4, 5];
    let level = store.get('grammar:level', 0); // 0 = все уровни
    const levelsEl = document.getElementById('levels');
    const search = document.getElementById('search');

    function stats() {
      const k = grammarUI.known();
      document.getElementById('stats').textContent = 'Знаю ' + GRAMMAR.filter((r) => k.has(grammarUI.id(r))).length + ' из ' + GRAMMAR.length + ' правил · ' +
        LEVELS.map((l) => 'HSK' + l + ': ' + GRAMMAR.filter((r) => r[0] === l && k.has(grammarUI.id(r))).length + '/' + GRAMMAR.filter((r) => r[0] === l).length).join(' · ');
    }

    function render() {
      levelsEl.replaceChildren(...[0, ...LEVELS].map((l) => h('button', { class: l === level ? 'on' : '', onclick: () => { level = l; store.set('grammar:level', l); render(); } }, l ? 'HSK ' + l : 'Все')));
      document.getElementById('day').replaceChildren(grammarUI.ruleOfDay(level ? [level] : LEVELS, () => { stats(); renderList(); }));
      renderList();
      stats();
    }

    function renderList() {
      const q = search.value.trim().toLowerCase();
      const rows = [];
      let last = null;
      GRAMMAR.forEach((r) => {
        if (level && r[0] !== level) return;
        if (q && !(r[1] + ' ' + r[2] + ' ' + r[3] + ' ' + r[4].flat().join(' ')).toLowerCase().includes(q)) return;
        if (r[0] !== last) { rows.push(h('h4', { class: 'rule-level' }, 'HSK ' + r[0])); last = r[0]; }
        rows.push(grammarUI.ruleRow(r, stats));
      });
      document.getElementById('list').replaceChildren(...(rows.length ? rows : [h('p', { class: 'muted' }, 'Ничего не нашлось.')]));
    }
    search.addEventListener('input', renderList);
    render();
  </script>
  <script src="js/effects.js?v=202611031538"></script>
</body>
</html>
