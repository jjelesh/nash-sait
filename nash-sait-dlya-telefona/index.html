<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Наш сайт">
  <meta name="theme-color" content="#f6d6df">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <title>Наш сайт для Дарьи</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=202611032254">
</head>
<body class="home">
  <svg class="stage" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice" aria-label="Цветок с разделами">
    <defs>
      <radialGradient id="petalGlow">
        <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
        <stop offset=".6" stop-color="#ffe3ec" stop-opacity=".6"/>
        <stop offset="1" stop-color="#ff9fbf" stop-opacity="0"/>
      </radialGradient>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
      <filter id="halo" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="10"/></filter>
      <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff3d6"/>
        <stop offset=".5" stop-color="#d9b46e"/>
        <stop offset="1" stop-color="#a87b3a"/>
      </linearGradient>
      <radialGradient id="medalCore" cx=".35" cy=".3">
        <stop offset="0" stop-color="#fff"/>
        <stop offset="1" stop-color="#f6bcd0"/>
      </radialGradient>
    </defs>
    <image href="assets/bg.webp" width="1672" height="941"/>
    <g id="sparkles"></g>
    <g id="petals"></g>
  </svg>

  <aside class="home-greet">
    <a class="hg-main" href="section.html?s=plan">
      <span class="hg-hello" id="hgHello">Добрый день</span>
      <span class="hg-stats" id="hgStats"></span>
    </a>
    <details class="hg-more">
      <summary id="todaySummary">дела на сегодня</summary>
      <ul id="todayList"></ul>
    </details>
  </aside>

  <nav class="petal-list" id="petalList"></nav>

  <button class="home-menu-btn" id="menuBtn" aria-expanded="false" aria-controls="homeMenu">
    <svg viewBox="0 0 34 24" aria-hidden="true"><path d="M3 20 L5 7 L11 13 L17 3 L23 13 L29 7 L31 20 Z"/><path d="M3 22 H31"/></svg>
    <span>меню</span>
  </button>
  <div class="home-bar home-menu" id="homeMenu" hidden>
    <a class="pill pill-main" href="section.html?s=plan">☾ Мой день</a>
    <button class="pill pill-main" onclick="day.whatNow()">✦ Что мне делать?</button>
    <button class="pill sos-pill" onclick="day.urge()">♥ SOS: залипаю</button>
    <span class="menu-sep"></span>
    <button class="pill" data-export>Сохранить копию</button>
    <button class="pill" data-import>Загрузить копию</button>
  </div>

  <script src="js/store.js?v=202611032254"></script>
  <script src="js/sync.js?v=202611032254"></script>
  <script src="js/discipline.js?v=202611032254"></script>
  <script src="js/sections.js?v=202611032254"></script>
  <script src="js/day.js?v=202611032254"></script>
  <script>
    // Где на картинке лежит каждый лепесток (в пикселях картинки 1672×941):
    // блик (cx, cy, rx, ry, наклон), подпись (lx, ly) и значок в медальоне.
    const SPOTS = {
      english:  { cx: 750,  cy: 525, rx: 75, ry: 42, rot: -62, lx: 735,  ly: 500, icon: 'Aa' },
      chinese:  { cx: 925,  cy: 525, rx: 75, ry: 42, rot: 62,  lx: 945,  ly: 500, icon: '中' },
      ddz:      { cx: 630,  cy: 570, rx: 85, ry: 34, rot: -18, lx: 600,  ly: 572, icon: '✎' },
      abroad:   { cx: 1050, cy: 570, rx: 85, ry: 34, rot: 18,  lx: 1080, ly: 572, icon: '✈' },
      ai:       { cx: 1050, cy: 670, rx: 85, ry: 36, rot: -12, lx: 1060, ly: 665, icon: '✦' },
      reading:  { cx: 1035, cy: 790, rx: 95, ry: 45, rot: -28, lx: 1045, ly: 790, icon: '❦' },
      plan:     { cx: 655,  cy: 790, rx: 95, ry: 45, rot: 28,  lx: 640,  ly: 790, icon: '☾' },
      popular:  { cx: 640,  cy: 670, rx: 85, ry: 36, rot: 12,  lx: 625,  ly: 665, icon: '★' }
    };
    // Красивые названия для цветка (в разделах остаются полные).
    const LABELS = {
      english: { name: 'Английский', sub: 'A2 → C1' },
      chinese: { name: 'Китайский', sub: 'HSK 3 · 4 · 中文' },
      ddz: { name: 'Домашка', sub: 'задания и дедлайны' },
      abroad: { name: 'Возможности', sub: 'гранты · стажировки' },
      ai: { name: 'Поиск', sub: 'интернет по делу' },
      reading: { name: 'Чтение', sub: 'книги вместо манхвы' },
      plan: { name: 'Мой день', sub: 'план · клубнички' },
      popular: { name: 'Блог', sub: 'TikTok · Instagram' }
    };
    const NS = 'http://www.w3.org/2000/svg';
    const el = (tag, attrs, parent) => {
      const n = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
      parent && parent.appendChild(n);
      return n;
    };

    const petals = document.getElementById('petals');
    const list = document.getElementById('petalList');
    SECTIONS.forEach((s, i) => {
      const p = SPOTS[s.id];
      const href = 'section.html?s=' + s.id;
      const a = el('a', { href, class: 'petal-hit', 'aria-label': s.petal, style: '--i:' + i }, petals);
      // Свечение в форме лепестка (миндаль), повёрнутое как настоящий лепесток.
      const rx = p.rx * 1.2, ry = p.ry * 1.25;
      const almond = `M${-rx},0 C${-rx * 0.35},${-ry * 1.25} ${rx * 0.45},${-ry * 1.05} ${rx},0 C${rx * 0.45},${ry * 1.05} ${-rx * 0.35},${ry * 1.25} ${-rx},0 Z`;
      const g = el('g', { transform: `translate(${p.cx} ${p.cy}) rotate(${p.rot})` }, a);
      el('path', { class: 'glow', d: almond, filter: 'url(#soft)' }, g);
      el('path', { class: 'edge', d: almond }, g);
      el('path', { d: almond, fill: 'transparent' }, g);

      // Подпись: каллиграфическое название и маленькая строка под ним, мягкий свет за ними.
      const L = LABELS[s.id];
      const lg = el('g', { class: 'label-group' }, a);
      el('ellipse', { class: 'label-halo', cx: p.lx, cy: p.ly + 2, rx: 96, ry: 34, filter: 'url(#halo)' }, lg);
      el('text', { class: 'label', x: p.lx, y: p.ly - 4 }, lg).textContent = L.name;
      el('text', { class: 'label-sub', x: p.lx, y: p.ly + 22 }, lg).textContent = L.sub;
      el('path', { class: 'orn', d: `M${p.lx - 34},${p.ly + 34} H${p.lx - 6} l6,-4 l6,4 l-6,4 l-6,-4 M${p.lx + 6},${p.ly + 34} H${p.lx + 34}`, style: `transform-origin:${p.lx}px ${p.ly + 34}px` }, lg);

      const li = document.createElement('a');
      li.href = href;
      li.innerHTML = '<b>' + LABELS[s.id].name + '</b><small>' + LABELS[s.id].sub + '</small>';
      list.appendChild(li);
    });

    // Мерцающие искорки над цветком.
    const sp = document.getElementById('sparkles');
    for (let i = 0; i < 22; i++) {
      const x = 520 + Math.random() * 640, y = 440 + Math.random() * 420, r = 1.5 + Math.random() * 2.5;
      el('circle', { class: 'sparkle', cx: x, cy: y, r, style: `animation-delay:${(Math.random() * 3).toFixed(2)}s;animation-duration:${(2 + Math.random() * 3).toFixed(2)}s` }, sp);
    }

    // Приветствие и задачи дня из всех лепестков, событий и дедлайнов.
    const g = day.greeting();
    const items = day.todayItems().filter((i) => !i.done);
    const st = discipline.stats();
    document.getElementById('hgHello').textContent = g.hello + ', ' + g.name;
    document.getElementById('hgStats').textContent = (st.streak ? '💋 ' + st.streak + ' · ' : '') + '🍓 ' + day.berries() + ' · ' + (items.length ? 'дел: ' + items.length : 'дел нет') ;
    document.getElementById('todaySummary').textContent = items.length ? 'что сегодня ▾' : g.sub;

    // Меню внизу: одна кнопка-корона вместо ряда пилюль.
    const menuBtn = document.getElementById('menuBtn'), menu = document.getElementById('homeMenu');
    const setMenu = (open) => { menu.hidden = !open; menuBtn.setAttribute('aria-expanded', open); menuBtn.classList.toggle('open', open); };
    menuBtn.addEventListener('click', (e) => { e.stopPropagation(); setMenu(menu.hidden); });
    document.addEventListener('click', (e) => { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
    const todayListEl = document.getElementById('todayList');
    todayListEl.replaceChildren(...(items.length ? items : [{ t: g.sub }]).map((it) => {
      const li = document.createElement('li');
      li.textContent = (it.tag ? it.tag + ': ' : '') + it.t;
      return li;
    }));
  </script>
  <script src="js/effects.js?v=202611032254"></script>
</body>
</html>
